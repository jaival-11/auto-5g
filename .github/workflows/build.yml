name: Build Auto 5G APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build GitHub Release APK
        run: ./gradlew assembleGithubRelease

      - name: Build F-Droid Release APK
        run: ./gradlew assembleFdroidRelease

      - name: Upload GitHub Release APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-5g-github-release
          path: app/build/outputs/apk/github/release/*.apk

      - name: Upload F-Droid Release APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-5g-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk
